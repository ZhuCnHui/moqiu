<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎾 摸球实验 · 学生端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #1a472a 0%, #2a6e3a 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 24px 22px 32px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #2d4a2d;
            margin-bottom: 4px;
        }
        h1 span {
            background: #ffbc6e;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #3b2a1f;
            display: inline-block;
            margin-top: 6px;
        }
        .sub {
            text-align: center;
            color: #6d8a6d;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .group-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .group-input label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .group-input input {
            width: 80px;
            font-size: 1.2rem;
            text-align: center;
            padding: 6px;
            border-radius: 30px;
            border: 2px solid #cfb284;
        }
        .group-input button {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
        }
        .ball-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .ball-btn {
            flex: 1;
            min-width: 80px;
            max-width: 140px;
            height: 100px;
            border: none;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.06s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .ball-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .ball-btn .icon { font-size: 2rem; }
        .ball-btn .label { font-size: 1.1rem; }
        .btn-red { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .btn-green { background: linear-gradient(145deg, #27ae60, #1e8449); }
        .btn-yellow { background: linear-gradient(145deg, #f1c40f, #d4a800); color: #3d3d1a; }
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 60px;
            background: #f8faf8;
            border-radius: 28px;
            padding: 10px 6px;
            text-align: center;
        }
        .stat-card .num { font-size: 2rem; font-weight: bold; }
        .stat-card .lbl { font-size: 0.75rem; color: #6d7a6d; }
        .num-red { color: #c0392b; }
        .num-green { color: #1e8449; }
        .num-yellow { color: #b7950b; }
        .num-total { color: #2d4a2d; }
        .record-area {
            background: #f5f8f5;
            border-radius: 28px;
            padding: 12px 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: white;
            border-radius: 20px;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .record-item .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .dot-red { background: #e74c3c; }
        .dot-green { background: #27ae60; }
        .dot-yellow { background: #f1c40f; }
        .empty-msg { text-align: center; color: #b0c0b0; padding: 20px 0; }
        .status { text-align: center; font-size: 0.85rem; color: #5d7a5d; margin-top: 8px; }

        /* 摄像头控制 */
        .camera-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 6px;
            flex-wrap: wrap;
        }
        .camera-btn {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 6px 24px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 3px 0 #16437e;
        }
        .camera-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #16437e; }
        .camera-btn.off { background: #6d8a6d; box-shadow: 0 3px 0 #3d5a3d; }
        .camera-btn.on { background: #27ae60; box-shadow: 0 3px 0 #1e8449; }
        .camera-status-text {
            font-size: 0.85rem;
            color: #5d7a5d;
            background: #e8f0e8;
            padding: 4px 16px;
            border-radius: 20px;
        }
        .camera-status-text.active { color: #27ae60; background: #d4f0d4; }
        .camera-status-text.error { color: #e74c3c; background: #fdd; }

        footer { text-align: center; font-size: 0.7rem; color: #ad8f6c; margin-top: 16px; }
        @media (max-width: 480px) {
            .ball-btn { height: 80px; font-size: 1.1rem; min-width: 60px; }
            .ball-btn .icon { font-size: 1.6rem; }
            .stat-card .num { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎾 摸球实验 <span>学生端</span></h1>
    <div class="sub">👆 点击对应颜色的球，记录一次摸球结果</div>

    <div class="group-input">
        <label>小组编号：</label>
        <input type="number" id="groupInput" value="1" min="1" max="99">
        <button id="joinBtn">加入</button>
    </div>

    <div id="mainArea" style="display:none;">
        <div class="ball-buttons">
            <button class="ball-btn btn-red" id="btnRed"><span class="icon">🔴</span><span class="label">红球</span></button>
            <button class="ball-btn btn-green" id="btnGreen"><span class="icon">🟢</span><span class="label">绿球</span></button>
            <button class="ball-btn btn-yellow" id="btnYellow"><span class="icon">🟡</span><span class="label">黄球</span></button>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="num num-red" id="statRed">0</div><div class="lbl">🔴 红球</div></div>
            <div class="stat-card"><div class="num num-green" id="statGreen">0</div><div class="lbl">🟢 绿球</div></div>
            <div class="stat-card"><div class="num num-yellow" id="statYellow">0</div><div class="lbl">🟡 黄球</div></div>
            <div class="stat-card"><div class="num num-total" id="statTotal">0</div><div class="lbl">📊 合计</div></div>
        </div>

        <div class="record-area" id="recordList">
            <div class="empty-msg">还没有记录，点击按钮开始摸球吧 👆</div>
        </div>

        <!-- 摄像头控制 -->
        <div class="camera-control">
            <button id="cameraToggleBtn" class="camera-btn off">📷 开启摄像头</button>
            <span class="camera-status-text" id="cameraStatusText">摄像头未开启</span>
        </div>

        <div class="status" id="statusMsg">🔄 等待加入小组...</div>
    </div>
    <footer>每次摸球后放回，数据实时同步给老师</footer>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let groupId = null;
    let myStats = { total: 0, red: 0, green: 0, yellow: 0 };
    let records = [];
    let cameraStream = null;
    let captureInterval = null;
    let cameraActive = false;
    let frameCount = 0;

    const mainArea = document.getElementById('mainArea');
    const groupInput = document.getElementById('groupInput');
    const joinBtn = document.getElementById('joinBtn');
    const statusMsg = document.getElementById('statusMsg');
    const cameraToggleBtn = document.getElementById('cameraToggleBtn');
    const cameraStatusText = document.getElementById('cameraStatusText');

    // ----- UI 更新 -----
    function updateUI() {
        document.getElementById('statRed').textContent = myStats.red;
        document.getElementById('statGreen').textContent = myStats.green;
        document.getElementById('statYellow').textContent = myStats.yellow;
        document.getElementById('statTotal').textContent = myStats.total;

        if (records.length === 0) {
            document.getElementById('recordList').innerHTML = `<div class="empty-msg">还没有记录，点击按钮开始摸球吧 👆</div>`;
        } else {
            let html = '';
            records.slice().reverse().forEach((rec, idx) => {
                const seq = records.length - idx;
                html += `<div class="record-item">
                    <span>#${seq} <span class="dot dot-${rec.color}"></span> ${rec.color === 'red' ? '红球' : rec.color === 'green' ? '绿球' : '黄球'}</span>
                    <span>${rec.time}</span>
                </div>`;
            });
            document.getElementById('recordList').innerHTML = html;
        }
    }

    function addRecord(color) {
        if (!groupId) { alert('请先加入小组！'); return; }
        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
        records.push({ color, time: timeStr });
        myStats.total++;
        if (color === 'red') myStats.red++;
        else if (color === 'green') myStats.green++;
        else if (color === 'yellow') myStats.yellow++;
        updateUI();
        socket.emit('record', { groupId, color });
        statusMsg.textContent = `✅ 已记录 ${color === 'red' ? '红球' : color === 'green' ? '绿球' : '黄球'}`;
    }

    // ----- 摄像头（超低数据量版本） -----
    function startCamera() {
        if (cameraActive) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            cameraStatusText.textContent = '❌ 浏览器不支持摄像头';
            cameraStatusText.className = 'camera-status-text error';
            return;
        }
        cameraStatusText.textContent = '⏳ 请求权限...';
        cameraStatusText.className = 'camera-status-text';
        cameraToggleBtn.disabled = true;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
            .then(stream => {
                cameraStream = stream;
                cameraActive = true;
                cameraToggleBtn.textContent = '📷 关闭摄像头';
                cameraToggleBtn.className = 'camera-btn on';
                cameraStatusText.textContent = '✅ 摄像头已开启（低质量模式）';
                cameraStatusText.className = 'camera-status-text active';
                cameraToggleBtn.disabled = false;

                const video = document.createElement('video');
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.play();
                const canvas = document.createElement('canvas');
                // ★★★ 超低分辨率 ★★★
                canvas.width = 80;
                canvas.height = 60;
                const ctx = canvas.getContext('2d');

                if (captureInterval) clearInterval(captureInterval);
                // ★★★ 2秒一帧 ★★★
                captureInterval = setInterval(() => {
                    if (!cameraActive) return;
                    ctx.drawImage(video, 0, 0, 80, 60);
                    // ★★★ 极低画质 0.1 ★★★
                    const frame = canvas.toDataURL('image/jpeg', 0.1);
                    frameCount++;
                    socket.emit('videoFrame', { groupId, frame });
                    // 每5帧输出一次日志（避免刷屏）
                    if (frameCount % 5 === 0) {
                        console.log(`📤 已发送 ${frameCount} 帧，帧大小约 ${Math.round(frame.length/1024)} KB`);
                    }
                }, 2000);
            })
            .catch(err => {
                console.error('摄像头启动失败:', err);
                cameraStatusText.textContent = '❌ 权限被拒绝，请允许后重试';
                cameraStatusText.className = 'camera-status-text error';
                cameraToggleBtn.textContent = '📷 重试';
                cameraToggleBtn.className = 'camera-btn off';
                cameraToggleBtn.disabled = false;
            });
    }

    function stopCamera() {
        if (captureInterval) {
            clearInterval(captureInterval);
            captureInterval = null;
        }
        if (cameraStream) {
            cameraStream.getTracks().forEach(track => track.stop());
            cameraStream = null;
        }
        cameraActive = false;
        cameraToggleBtn.textContent = '📷 开启摄像头';
        cameraToggleBtn.className = 'camera-btn off';
        cameraStatusText.textContent = '摄像头已关闭';
        cameraStatusText.className = 'camera-status-text';
    }

    function toggleCamera() {
        if (cameraActive) {
            stopCamera();
        } else {
            startCamera();
        }
    }

    // ----- 加入小组 -----
    function joinGroup() {
        const val = parseInt(groupInput.value);
        if (isNaN(val) || val < 1) { alert('请输入有效的小组编号'); return; }
        groupId = String(val);
        socket.emit('registerGroup', groupId);
        mainArea.style.display = 'block';
        statusMsg.textContent = `✅ 已加入第 ${groupId} 组`;
        myStats = { total: 0, red: 0, green: 0, yellow: 0 };
        records = [];
        updateUI();
        stopCamera();
        cameraToggleBtn.textContent = '📷 开启摄像头';
        cameraToggleBtn.className = 'camera-btn off';
        cameraStatusText.textContent = '摄像头未开启';
        cameraStatusText.className = 'camera-status-text';
    }

    // ----- 事件绑定 -----
    joinBtn.addEventListener('click', joinGroup);
    groupInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') joinGroup(); });

    document.getElementById('btnRed').addEventListener('click', () => addRecord('red'));
    document.getElementById('btnGreen').addEventListener('click', () => addRecord('green'));
    document.getElementById('btnYellow').addEventListener('click', () => addRecord('yellow'));

    cameraToggleBtn.addEventListener('click', toggleCamera);

    // Socket 事件
    socket.on('recordConfirmed', (data) => {
        statusMsg.textContent = `✅ 第 ${data.total} 次已确认`;
    });

    socket.on('initStats', (data) => {
        if (data && data.total > 0) {
            myStats = { total: data.total, red: data.red, green: data.green, yellow: data.yellow };
            records = data.records || [];
            updateUI();
            statusMsg.textContent = `📊 已加载历史数据，共 ${myStats.total} 次`;
        }
    });

    // 页面关闭释放资源
    window.addEventListener('beforeunload', () => {
        if (captureInterval) clearInterval(captureInterval);
        if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
    });
</script>
</body>
</html>
