<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>🎾 摸球实验 · 学生端</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #1a472a 0%, #2a6e3a 100%);
            font-family: 'Segoe UI', 'Comic Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            padding: 24px 22px 32px;
        }
        h1 {
            text-align: center;
            font-size: 1.8rem;
            color: #2d4a2d;
            margin-bottom: 4px;
        }
        h1 span {
            background: #ffbc6e;
            padding: 4px 16px;
            border-radius: 50px;
            font-size: 0.9rem;
            color: #3b2a1f;
            display: inline-block;
            margin-top: 6px;
        }
        .sub {
            text-align: center;
            color: #6d8a6d;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .group-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .group-input label {
            font-weight: bold;
            font-size: 1.1rem;
        }
        .group-input input {
            width: 80px;
            font-size: 1.2rem;
            text-align: center;
            padding: 6px;
            border-radius: 30px;
            border: 2px solid #cfb284;
        }
        .group-input button {
            background: #3a86ff;
            color: white;
            border: none;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
        }
        .ball-buttons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 16px 0 20px;
            flex-wrap: wrap;
        }
        .ball-btn {
            flex: 1;
            min-width: 80px;
            max-width: 140px;
            height: 100px;
            border: none;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            cursor: pointer;
            transition: 0.06s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .ball-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        .ball-btn .icon { font-size: 2rem; }
        .ball-btn .label { font-size: 1.1rem; }
        .btn-red { background: linear-gradient(145deg, #e74c3c, #c0392b); }
        .btn-green { background: linear-gradient(145deg, #27ae60, #1e8449); }
        .btn-yellow { background: linear-gradient(145deg, #f1c40f, #d4a800); color: #3d3d1a; }
        .stats-row {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            min-width: 60px;
            background: #f8faf8;
            border-radius: 28px;
            padding: 10px 6px;
            text-align: center;
        }
        .stat-card .num { font-size: 2rem; font-weight: bold; }
        .stat-card .lbl { font-size: 0.75rem; color: #6d7a6d; }
        .num-red { color: #c0392b; }
        .num-green { color: #1e8449; }
        .num-yellow { color: #b7950b; }
        .num-total { color: #2d4a2d; }
        .record-area {
            background: #f5f8f5;
            border-radius: 28px;
            padding: 12px 16px;
            max-height: 200px;
            overflow-y: auto;
        }
        .record-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: white;
            border-radius: 20px;
            margin-bottom: 4px;
            font-size: 0.9rem;
        }
        .record-item .dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .dot-red { background: #e74c3c; }
        .dot-green { background: #27ae60; }
        .dot-yellow { background: #f1c40f; }
        .empty-msg { text-align: center; color: #b0c0b0; padding: 20px 0; }
        .status { text-align: center; font-size: 0.85rem; color: #5d7a5d; margin-top: 8px; }
        footer { text-align: center; font-size: 0.7rem; color: #ad8f6c; margin-top: 16px; }
        @media (max-width: 480px) {
            .ball-btn { height: 80px; font-size: 1.1rem; min-width: 60px; }
            .ball-btn .icon { font-size: 1.6rem; }
            .stat-card .num { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🎾 摸球实验 <span>学生端</span></h1>
    <div class="sub">👆 点击对应颜色的球，记录一次摸球结果</div>

    <div class="group-input">
        <label>小组编号：</label>
        <input type="number" id="groupInput" value="1" min="1" max="99">
        <button id="joinBtn">加入</button>
    </div>

    <div id="mainArea" style="display:none;">
        <div class="ball-buttons">
            <button class="ball-btn btn-red" id="btnRed"><span class="icon">🔴</span><span class="label">红球</span></button>
            <button class="ball-btn btn-green" id="btnGreen"><span class="icon">🟢</span><span class="label">绿球</span></button>
            <button class="ball-btn btn-yellow" id="btnYellow"><span class="icon">🟡</span><span class="label">黄球</span></button>
        </div>

        <div class="stats-row">
            <div class="stat-card"><div class="num num-red" id="statRed">0</div><div class="lbl">🔴 红球</div></div>
            <div class="stat-card"><div class="num num-green" id="statGreen">0</div><div class="lbl">🟢 绿球</div></div>
            <div class="stat-card"><div class="num num-yellow" id="statYellow">0</div><div class="lbl">🟡 黄球</div></div>
            <div class="stat-card"><div class="num num-total" id="statTotal">0</div><div class="lbl">📊 合计</div></div>
        </div>

        <div class="record-area" id="recordList">
            <div class="empty-msg">还没有记录，点击上方按钮开始摸球吧 👆</div>
        </div>
        <div class="status" id="statusMsg">🔄 等待加入小组...</div>
    </div>
    <footer>每次摸球后放回，数据实时同步给老师</footer>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let groupId = null;
    let myStats = { total: 0, red: 0, green: 0, yellow: 0 };
    let records = [];

    const mainArea = document.getElementById('mainArea');
    const groupInput = document.getElementById('groupInput');
    const joinBtn = document.getElementById('joinBtn');
    const statusMsg = document.getElementById('statusMsg');

    function updateUI() {
        document.getElementById('statRed').textContent = myStats.red;
        document.getElementById('statGreen').textContent = myStats.green;
        document.getElementById('statYellow').textContent = myStats.yellow;
        document.getElementById('statTotal').textContent = myStats.total;

        if (records.length === 0) {
            document.getElementById('recordList').innerHTML = `<div class="empty-msg">还没有记录，点击按钮开始摸球吧 👆</div>`;
        } else {
            let html = '';
            records.slice().reverse().forEach((rec, idx) => {
                const seq = records.length - idx;
                html += `<div class="record-item">
                    <span>#${seq} <span class="dot dot-${rec.color}"></span> ${rec.color === 'red' ? '红球' : rec.color === 'green' ? '绿球' : '黄球'}</span>
                    <span>${rec.time}</span>
                </div>`;
            });
            document.getElementById('recordList').innerHTML = html;
        }
    }

    function addRecord(color) {
        if (!groupId) { alert('请先加入小组！'); return; }
        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
        records.push({ color, time: timeStr });
        myStats.total++;
        if (color === 'red') myStats.red++;
        else if (color === 'green') myStats.green++;
        else if (color === 'yellow') myStats.yellow++;
        updateUI();
        socket.emit('record', { groupId, color });
        statusMsg.textContent = `✅ 已记录 ${color === 'red' ? '红球' : color === 'green' ? '绿球' : '黄球'}，已同步给老师`;
    }

    function joinGroup() {
        const val = parseInt(groupInput.value);
        if (isNaN(val) || val < 1) { alert('请输入有效的小组编号'); return; }
        groupId = String(val);
        socket.emit('registerGroup', groupId);
        mainArea.style.display = 'block';
        statusMsg.textContent = `✅ 已加入第 ${groupId} 组，开始摸球吧！`;
        // 重置本地数据
        myStats = { total: 0, red: 0, green: 0, yellow: 0 };
        records = [];
        updateUI();
    }

    joinBtn.addEventListener('click', joinGroup);
    groupInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') joinGroup(); });

    document.getElementById('btnRed').addEventListener('click', () => addRecord('red'));
    document.getElementById('btnGreen').addEventListener('click', () => addRecord('green'));
    document.getElementById('btnYellow').addEventListener('click', () => addRecord('yellow'));

    // 接收服务器确认
    socket.on('recordConfirmed', (data) => {
        statusMsg.textContent = `✅ 第 ${data.total} 次摸球已确认`;
    });

    socket.on('initStats', (data) => {
        if (data && data.total > 0) {
            myStats = { total: data.total, red: data.red, green: data.green, yellow: data.yellow };
            records = data.records || [];
            updateUI();
            statusMsg.textContent = `📊 已加载历史数据，共 ${myStats.total} 次记录`;
        }
    });
</script>
</body>
</html>
